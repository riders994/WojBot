[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wojbot"
version = "2.0.0"
description = "WojBot v2 — a Discord bot for a fantasy basketball league"
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.7.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    # SQL connection manager + named-query registry (psycopg2), and the
    # anonymizer the Elo backend tokenises through. 1.3 is the floor: before it,
    # anonymize() renumbered its whole map on every call, so each sync silently
    # repointed the tokens already stored in the warehouse.
    "rv_pytools>=1.3.0",
    # Elo ratings engine driven by the commish cog. The sleeper extra is not
    # optional here: die_nasty is a Sleeper league, and without it every scrape
    # of one raises ImportError from SleeperScraper.
    "elo-system[sleeper]>=2.0.1",
]

[project.optional-dependencies]
# The rumor rules are the first thing here worth testing without a database or
# a Discord connection; `pip install -e .[dev]` gets the runner.
dev = ["pytest>=8"]

[project.scripts]
wojbot = "wojbot.__main__:main"

[tool.setuptools.packages.find]
include = ["wojbot*"]
